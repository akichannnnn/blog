# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
rssFullContent = true
favicon = "img/favicon.png"

SortBy = "default"

[footer]
since = 2023
customText = "Powered by Hugo "

[dateFormat]
published = ":date_full"
lastUpdated = ":date_full"

[sidebar]
emoji = ""
subtitle = "自由软件爱好者。"
avatar = "img/avatar.png"

[article]
headingAnchor = false
math = false
readingTime = true

[article.license]
enabled = true
default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
homepage = [
  { type = "search" },
  { type = "archives", params = { limit = 5 } },
  { type = "categories", params = { limit = 10 } },
  { type = "tag-cloud", params = { limit = 10 } },
]
page = [{ type = "toc" }]

[opengraph.twitter]
site = "@k49ur473"
card = "summary_large_image"

[colorScheme]
toggle = true
default = "auto"

[comments]
enabled = true
provider = "waline"

[comments.waline]
serverURL = "https://comment.akich.io/"
lang = "zh-CN"
requiredMeta = ["nick", "mail"]
emoji = ["https://unpkg.com/@waline/emojis@1.0.1/weibo", "https://unpkg.com/@waline/emojis@1.0.1/bilibili"]

[comments.waline.locale]
admin = "站长"
placeholder = "欢迎留言~"

[sponsor]
enabled = true
badge = "赞助"
message = "本文为赞助内容，登录爱发电并验证有效订阅后即可阅读全文。"
sponsor_url = "https://afdian.com/a/yimingqi"
sponsor_label = "前往赞助"
# 爱发电 OAuth 验证服务（Cloudflare Worker，见 workers/afdian-auth）
# GitHub Pages 纯静态无法跑后端，故部署到独立的 api.akich.io
auth_api_url = "https://api.akich.io"

[sponsor.afdian]
# OAuth 应用页面：https://afdian.com/p/9c65d9cc617011ed81c352540025c377
oauth_app_url = "https://afdian.com/p/9c65d9cc617011ed81c352540025c377"
# 需要验证的赞助方案 ID（留空则任意有效订阅均可解锁）
plan_id = ""
