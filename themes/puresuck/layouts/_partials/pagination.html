{{ if gt .TotalPages 1 }}
<nav class="pager" aria-label="分页">
  <span>第 {{ .PageNumber }} 页 / 共 {{ .TotalPages }} 页</span>
  <span class="pager-links">
    {{ if .HasPrev }}<a href="{{ .Prev.URL }}" rel="prev">← 上一页</a>{{ end }}
    {{ if .HasNext }}<a href="{{ .Next.URL }}" rel="next">下一页 →</a>{{ end }}
  </span>
</nav>
{{ end }}
